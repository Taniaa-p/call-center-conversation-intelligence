# Prometheus scrapes the API and the worker and evaluates ops/alerts.yml.
# UI: http://localhost:9090 (Alerts tab shows rule state).
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: worker
    static_configs: [{targets: ["worker:9101"]}]

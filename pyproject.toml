[project]
name = "convo-intel"
version = "0.1.0"
description = "Call-center conversation intelligence microservice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "asyncpg>=0.29",
    "redis>=5.0",
    "arq>=0.26",
    "google-genai>=1.0",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Heavy ML extras (PyTorch). Only needed for the GLiNER / RoBERTa backends and the
# PII + sentiment experiments. The default build uses regex + lexicon backends.
ml = ["gliner>=0.2", "transformers>=4.40", "torch>=2.3", "sentencepiece>=0.2", "protobuf>=4.25"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]

[tool.uv]
package = false
